# strongSwan 6.0.2 配置文件

charon {
    load_modular = yes
    plugins {
        include strongswan.d/charon/*.conf
        eap-radius {
            servers = 127.0.0.1
            port = 1812
            secret = testing123
            nas_identifier = strongSwan
        }
    }
    
    port = 500
    port_nat_t = 4500
    threads = 16
    retransmit_tries = 3
    retransmit_timeout = 4.0
    reauth_time = 0
    rekey_time = 4h
    rekey_bytes = 100m
    rekey_packets = 1000000
    close_action = none
    send_vendor_id = yes
}

include strongswan.d/*.conf
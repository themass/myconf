# strongSwan 6.0.2 — 与 strongswan_conf_port/strongswan.conf 对齐（EAP-RADIUS + 自定义端口）
charon {
    load_modular = yes
    threads = 16
    uniqueids = never

    port = 8081
    port_nat_t = 8080

    retransmit_tries = 10
    retransmit_timeout = 6.0
    retry_initiate_interval = 60

    rekey_time = 4h
    rekey_bytes = 100m
    rekey_packets = 1000000
    reauth_time = 0

    close_action = none
    send_vendor_id = yes

    plugins {
        include strongswan.d/charon/*.conf

        eap-radius {
            accounting = yes
            servers {
                radiusServer {
                    secret = FreeVPN@vpn5296
                    address = radius.sspacee.com
                    auth_port = 1812
                    acct_port = 1813
                }
            }
        }
    }

    filelog {
        charon {
            path = /var/log/charon.log
            time_format = %b %e %T
            ike_name = yes
            append = no
            default = 1
            flush_line = yes
        }
        stderr {
            ike = 2
            knl = 3
        }
    }

    syslog {
        identifier = charon-custom
        daemon {
        }
        auth {
            default = -1
            ike = 0
        }
    }
}

include strongswan.d/*.conf

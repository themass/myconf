# strongSwan 6.0 优化配置 - 安全增强版
# 迁移自 strongSwan 5.6.3，并进行了安全优化
# 创建时间: $(date)

connections {
    # 默认连接配置 - 使用现代安全算法
    defaults {
        local_addrs = %any
        remote_addrs = %any
        version = 2
        # 优化的加密套件 - 移除不安全的算法
        proposals = aes256gcm128-sha256-ecp384,aes256gcm128-sha256-modp4096,aes256-sha256-ecp384,aes256-sha256-modp4096,aes128-sha256-ecp256,aes128-sha256-modp2048
        dpd_delay = 30s
        dpd_timeout = 120s
        dpd_action = restart
        rekey_time = 4h
        reauth_time = 8h
        fragmentation = yes
        unique = replace
        # 启用 Perfect Forward Secrecy
        rekey_margin = 10m
        # 连接超时设置
        over_time = 10m
        rand_time = 120s
    }

    # 主要 RADIUS 连接配置 - 安全优化
    radius-secure {
        local {
            auth = pubkey
            certs = serverCert.pem
            id = @server.sspacee.com
        }
        remote {
            auth = eap-radius
            eap_id = %any
            # 限制重试次数
            send_certreq = no
        }
        children {
            radius-secure {
                local_ts = 0.0.0.0/0,::/0
                remote_ts = 10.0.0.0/24,fec3::/120
                updown = /etc/swanctl/scripts/updown-secure.sh
                # 优化的 ESP 加密套件
                esp_proposals = aes256gcm128-sha256-ecp384,aes256gcm128-sha256-modp4096,aes256-sha256-ecp384,aes256-sha256-modp4096
                # 启用压缩
                ipcomp = yes
                # 设置生存时间
                life_time = 1h
                rekey_time = 30m
                # 启用流量统计
                mode = tunnel
                start_action = trap
            }
        }
    }

    # 第二个 RADIUS 连接配置 - 安全优化
    radius3-secure {
        local {
            auth = pubkey
            certs = serverCert3.pem
            id = 154.22.124.96
        }
        remote {
            auth = eap-radius
            eap_id = %any
            send_certreq = no
        }
        children {
            radius3-secure {
                local_ts = 0.0.0.0/0,::/0
                remote_ts = 10.3.0.0/24,fec3::/120
                updown = /etc/swanctl/scripts/updown-secure.sh
                esp_proposals = aes256gcm128-sha256-ecp384,aes256gcm128-sha256-modp4096,aes256-sha256-ecp384,aes256-sha256-modp4096
                ipcomp = yes
                life_time = 1h
                rekey_time = 30m
                mode = tunnel
                start_action = trap
            }
        }
    }
}

authorities {
    # CA 证书配置 - 增强安全
    ca {
        cacert = caCert.pem
        crl_uris = http://crl.sspacee.com/ca.crl
        # 启用 OCSP
        ocsp_uris = http://ocsp.sspacee.com/
        # 证书验证设置
        crl_strict = yes
        crl_cache_time = 1h
    }
    ca3 {
        cacert = caCert3.pem
        crl_uris = http://crl.sspacee.com/ca3.crl
        ocsp_uris = http://ocsp.sspacee.com/
        crl_strict = yes
        crl_cache_time = 1h
    }
}

pools {
    # IP 地址池配置 - 安全增强
    radius-pool {
        addrs = 10.0.0.0/24
        dns = 8.8.8.8, 1.1.1.1, 114.114.114.114
        # 添加 NBNS 服务器
        nbns = 8.8.8.8
    }
    radius3-pool {
        addrs = 10.3.0.0/24
        dns = 8.8.8.8, 1.1.1.1, 114.114.114.114
        nbns = 8.8.8.8
    }
}



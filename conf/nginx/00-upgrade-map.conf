# 放在 http 上下文（server/*.conf 由 nginx.conf 的 include 引入）。
# 没有 Upgrade 头的普通请求 Connection 取 close，nginx 对上游仍走 keepalive；
# 带 Upgrade 的请求（游戏 WebSocket）才透传 upgrade。server 块里用
# proxy_set_header Connection $connection_upgrade; 引用这里的变量。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

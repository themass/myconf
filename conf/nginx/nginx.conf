user  web;
worker_processes  auto;
error_log  /var/log/nginx.error.log  warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    use epoll;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$host - $request" '
                      '$status $body_bytes_sent $request_time "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx.access.log  main;
    server_name_in_redirect off;
    port_in_redirect off;
    limit_req_zone $binary_remote_addr zone=one:10m rate=100r/s;

    include server/*.conf;

    proxy_set_header Host  $host;
    proxy_set_header REMOTE-HOST $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    proxy_buffer_size  512k;
    underscores_in_headers on;
    proxy_buffers   8 512k;
    proxy_busy_buffers_size   512k;
    proxy_temp_path /home/file/nginx/cache/temp;

    sendfile        on;
    tcp_nopush     on;

    keepalive_timeout  65;

    fastcgi_connect_timeout 300;
    fastcgi_send_timeout 300;
    fastcgi_read_timeout 300;
    fastcgi_buffer_size 1m;
    fastcgi_buffers 8 1m;
    fastcgi_busy_buffers_size 1m;
    fastcgi_temp_file_write_size 1m;

    gzip on;
    gzip_min_length  1k;
    gzip_buffers     16 64k;
    gzip_http_version 1.1;
    gzip_comp_level 6;
    gzip_types   text/plain application/x-javascript text/css application/xml application/x-shockwave-flash application/json image/jpeg image/png image/gif;
    gzip_vary on;

    client_header_buffer_size 64k;
    large_client_header_buffers 8 64k;
    client_max_body_size 100m;
    client_body_temp_path  /home/file/nginx_cache/cache/body;
    client_body_buffer_size 1m;
}

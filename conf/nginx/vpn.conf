# api.ok123find.top / file.ok123find.top
#
# 80 与 443 共用一个 server 块，路由只写一次。
#   - 80：保留 HTTP（App 当前仍用 http）
#   - 443：HTTPS，证书就绪后生效
#   - 证书就绪且 App 切换 HTTPS 后，取消文末 301 跳转的注释即可强制跳转

# 原规则：Go-http-client 请求重定向到 Google
map $http_user_agent $is_go_client {
    default 0;
    ~*Go-http-client 1;
}

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    # api.ok124find.top 是主域名的备用域名：主域名在 DNS 层被投毒/阻断时，
    # 客户端（ApiHost）会切到这个域名继续请求。它必须和主域名共用同一套路由，
    # 否则切换过去会落到默认站点、返回 404，容灾等于没有。
    server_name api.ok123find.top file.ok123find.top api.ok124find.top;

    # HTTPS 证书（由 infra.sh nginx 生成自签，或替换成正式证书）
    ssl_certificate     {{SSL_DIR}}/fullchain.pem;
    ssl_certificate_key {{SSL_DIR}}/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 20m;
    gzip on;
    gzip_types application/json text/plain text/css application/javascript;
    gzip_min_length 1024;

    # 代理公共头：后端需要真实 IP 与协议
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 普通请求保持长连接；只有带 Upgrade 的请求（游戏 WebSocket）才透传 upgrade。
    # 写死 Connection "" 会盖掉 location 里的设置，握手到不了后端。
    proxy_set_header Connection $connection_upgrade;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;

    # certbot webroot 校验
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    if ($is_go_client) {
        return 301 https://www.google.com;
    }

    # 游戏模块：WebSocket 必须单独一块。通用 /vvv/ 块里的 rewrite ... break 写在
    # proxy_pass 前面，nginx 会把它当成 URI 重写，location 里设的 Host 和
    # Connection 全部失效，握手到后端就变成 Host 为 upstream 名、Connection 为 close。
    # 所以这里用带 URI 的 proxy_pass 做路径改写，并在本块里显式重写这两个头。
    # ^~ 前缀优先于后面的 /vvv/。
    location ^~ /vvv/api/game/ws {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # 后端按 Host 路由。$host 和 $proxy_host 在这里都解析成 upstream 的名字
        # vpn_server，后端直接 400，所以写死成后端实际监听的地址。
        proxy_set_header Host 127.0.0.1:8888;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://vpn_server/api/game/ws;
    }
    # 游戏的普通接口：显式声明 JSON，同样优先于通用 /vvv/ 块。
    location ^~ /vvv/api/game/v1/ {
        default_type application/json;
        expires -1;
        rewrite ^/vvv(/.*)$ $1 break;
        proxy_pass http://vpn_server;
    }

    # 通用 API：/vvv 下的接口返回 JSON
    location /vvv/ {
        default_type application/json;
        expires -1;
        rewrite ^/vvv(/.*)$ $1 break;
        proxy_pass http://vpn_server;
    }

    # 视频条目
    location = /vvv/api/video/item {
        default_type application/json;
        expires -1;
        rewrite ^/vvv(/.*)$ $1 break;
        proxy_pass http://fetchurl_server;
    }

    # AI 文件 / OCR / 本地模型：精确或前缀匹配，优先于 /vvv/api/chat
    location = /vvv/api/chat/ai/file.json {
        default_type application/json;
        rewrite ^/vvv(/.*)$ $1 break;
        proxy_pass http://chat_server1;
    }
    location = /vvv/api/chat/ai/ocr.json {
        default_type application/json;
        rewrite ^/vvv(/.*)$ $1 break;
        proxy_pass http://chat_server1;
    }
    location ^~ /vvv/api/chat/ai/local {
        default_type application/json;
        rewrite ^/vvv(/.*)$ $1 break;
        proxy_pass http://chat_server1;
    }

    # 聊天接口：可能是流式输出，关闭缓冲，逐字返回
    location ^~ /vvv/api/chat {
        default_type application/json;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        rewrite ^/vvv(/.*)$ $1 break;
        proxy_pass http://chat_server;
    }

    location ^~ /vvv/api/test {
        default_type application/json;
        rewrite ^/vvv(/.*)$ $1 break;
        proxy_pass http://chat_server;
    }

    location ^~ /BookManager {
        proxy_pass http://book_server;
    }

    # 静态文件
    location ^~ /file/ {
        alias /home/file/html/;
    }
    location ^~ /image/ {
        alias /home/web/webroot/files/;
    }
    location ^~ /soft {
        alias /home/file/soft;
    }
    location = /favicon.ico {
        return 404;
    }

    # 站点首页
    location / {
        alias /home/file/html/;
        try_files $uri $uri/ =404;
    }

    # 切换 HTTPS 后取消注释（放在 location / 之前）：
    # if ($scheme = http) {
    #     return 301 https://$host$request_uri;
    # }
}

# PostgreSQL 客户端认证，由 infra.sh postgres 写入 /etc/postgresql/<版本>/main/pg_hba.conf
# 原则：只允许本机和内网访问，密码用 scram-sha-256，不允许 trust。
# {{NET}} 由脚本替换成本机内网地址所在的 /24（如 10.1.2.0/24），取自 INFRA_BIND 或自动识别的内网地址。

# TYPE  DATABASE        USER            ADDRESS                 METHOD
local   all             postgres                                peer
local   all             all                                     scram-sha-256
host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             ::1/128                 scram-sha-256
host    all             all             {{NET}}                 scram-sha-256

# /root/local/nginx/conf/server/vpn.conf
# api.ok123find.top / file.ok123find.top
#
# 单文件版：80 与 443 共用一个 server 块，路由只写一次。
#   - 80：保留 HTTP（App 当前仍用 http）
#   - 443：HTTPS，证书就绪后生效
#   - 证书就绪且 App 切换 HTTPS 后，取消文末 301 跳转的注释即可强制跳转

# 原规则：Go-http-client 请求重定向到 Google
map $http_user_agent $is_go_client {
    default 0;
    ~*Go-http-client 1;
}

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.ok123find.top file.ok123find.top;

    # HTTPS 证书（certbot.sh / self-signed.sh 写入这里）
    ssl_certificate     /root/local/nginx/conf/ssl/fullchain.pem;
    ssl_certificate_key /root/local/nginx/conf/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 20m;
    gzip on;
    gzip_types application/json text/plain text/css application/javascript;
    gzip_min_length 1024;

    # 代理公共头：后端需要真实 IP 与协议
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;

    # certbot webroot 校验
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    if ($is_go_client) {
        return 301 https://www.google.com;
    }

    # 通用 API：/vvv 下的接口返回 JSON
    location /vvv/ {
        default_type application/json;
        expires -1;
        rewrite ^/vvv(/.*)$ $1 break;
        proxy_pass http://vpn_server;
    }

    # 视频条目
    location = /vvv/api/video/item {
        default_type application/json;
        expires -1;
        rewrite ^/vvv(/.*)$ $1 break;
        proxy_pass http://fetchurl_server;
    }

    # AI 文件 / OCR / 本地模型：精确或前缀匹配，优先于 /vvv/api/chat
    location = /vvv/api/chat/ai/file.json {
        default_type application/json;
        rewrite ^/vvv(/.*)$ $1 break;
        proxy_pass http://chat_server1;
    }
    location = /vvv/api/chat/ai/ocr.json {
        default_type application/json;
        rewrite ^/vvv(/.*)$ $1 break;
        proxy_pass http://chat_server1;
    }
    location ^~ /vvv/api/chat/ai/local {
        default_type application/json;
        rewrite ^/vvv(/.*)$ $1 break;
        proxy_pass http://chat_server1;
    }

    # 聊天接口：可能是流式输出，关闭缓冲，逐字返回
    location ^~ /vvv/api/chat {
        default_type application/json;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        rewrite ^/vvv(/.*)$ $1 break;
        proxy_pass http://chat_server;
    }

    location ^~ /vvv/api/test {
        default_type application/json;
        rewrite ^/vvv(/.*)$ $1 break;
        proxy_pass http://chat_server;
    }

    location ^~ /BookManager {
        proxy_pass http://book_server;
    }

    # 静态文件
    location ^~ /file/ {
        alias /home/file/html/;
    }
    location ^~ /image/ {
        alias /home/web/webroot/files/;
    }
    location ^~ /soft {
        alias /home/file/soft;
    }
    location = /favicon.ico {
        return 404;
    }

    # 站点首页
    location / {
        alias /home/file/html/;
        try_files $uri $uri/ =404;
    }

    # 切换 HTTPS 后取消注释（放在 location / 之前）：
    # if ($scheme = http) {
    #     return 301 https://$host$request_uri;
    # }
}

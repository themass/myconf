# book.ok123find.top：80 保持 HTTP，443 使用证书。
#
# 注意：同一域名只能在一个文件里定义。旧服务器的 openapi.conf / openapi-http.conf
# 也声明了 book.ok123find.top，但按字母序 book.conf 先加载，那两个块从未生效，
# nginx -t 还会报 "conflicting server name ... ignored"。所以这里只保留 book.conf，
# 不迁 openapi*.conf（那两个是代理到 api.openai.com，实际一直没跑起来）。

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name book.ok123find.top;

    ssl_certificate     {{SSL_DIR}}/fullchain.pem;
    ssl_certificate_key {{SSL_DIR}}/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    charset utf-8;
    expires 5d;
    add_header Access-Control-Allow-Origin *;
    default_type application/octet-stream;

    # certbot webroot 校验（续期时需要通过 80 端口访问）
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        alias /home/file/book/;
    }
}

[Interface]
Address = {{SERVER_CIDR}}
ListenPort = {{PORT}}
PrivateKey = {{PRIVATE_KEY}}
# 规则先用 -C 检查再追加：重启后 iptables-persistent 已经恢复了这些规则，wg-quick 再 -A 会变成两份。
# PostDown 末尾的 || true：规则不存在时 -D 会报错，不能让它中断接口关闭。
PostUp = iptables -t nat -C POSTROUTING -s {{SUBNET}} -o {{NETDEV}} -j MASQUERADE 2>/dev/null || iptables -t nat -A POSTROUTING -s {{SUBNET}} -o {{NETDEV}} -j MASQUERADE; iptables -C FORWARD -i %i -j ACCEPT 2>/dev/null || iptables -A FORWARD -i %i -j ACCEPT; iptables -C FORWARD -o %i -j ACCEPT 2>/dev/null || iptables -A FORWARD -o %i -j ACCEPT
PostDown = iptables -t nat -D POSTROUTING -s {{SUBNET}} -o {{NETDEV}} -j MASQUERADE 2>/dev/null || true; iptables -D FORWARD -i %i -j ACCEPT 2>/dev/null || true; iptables -D FORWARD -o %i -j ACCEPT 2>/dev/null || true

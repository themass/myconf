# strongSwan 6.0.2 配置文件
# 参考官方文档: https://docs.strongswan.org/docs/latest/

charon {
    # 加载插件
    load_modular = yes
    plugins {
        include strongswan.d/charon/*.conf
    }
    
    # 日志配置
    filelog {
        /var/log/strongswan.log {
            time_format = %b %e %T
            ike_name = yes
            append = no
            default = 1
            flush_line = yes
        }
    }
    
    # 系统日志
    syslog {
        identifier = charon
        daemon {
            ike = 2
            knl = 2
        }
        auth {
            default = 2
        }
    }
    
    # 网络配置
    interfaces_use = lo
    interfaces_ignore = lo
    
    # 端口配置
    port = 500
    port_nat_t = 4500
    
    # 线程配置
    threads = 16
    
    # 内存池
    pools = ikev2
    
    # 重试配置
    retransmit_tries = 3
    retransmit_timeout = 4.0
    retransmit_base = 1.8
    retransmit_jitter = 0.2
    
    # 重连配置
    retransmit_limit = 5
    retransmit_window = 30
    
    # 重认证配置
    reauth_time = 0
    rekey_time = 4h
    rekey_bytes = 100m
    rekey_packets = 1000000
    
    # 连接配置
    close_action = none
    send_vendor_id = yes
    
    # 网络配置
    routing_table = 220
    routing_table_prio = 220
    
    # 虚拟IP配置
    virtual_private = %v4:10.0.0.0/8,%v4:192.168.0.0/16,%v4:172.16.0.0/12,%v4:25.0.0.0/8,%v4:100.64.0.0/10,%v6:fd00::/8,%v6:fe80::/10
}

# game.sspacee.com：game.ok123find.top 的镜像（飞机对决 H5 + 同源游戏接口）。
# 证书目前是 conf/ssl/game-sspacee-*.pem 自签占位；DNS 改到本机后用 certbot 签发。
server {
    listen 80;
    listen [::]:80;
    server_name game.sspacee.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://game.sspacee.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name game.sspacee.com;

    ssl_certificate     /root/local/nginx/conf/ssl/game-sspacee-fullchain.pem;
    ssl_certificate_key /root/local/nginx/conf/ssl/game-sspacee-privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /home/web/webroot/plane-duel;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }

    # 坑见 api-routes.inc 里的说明：带 URI 的 proxy_pass + 写死 Host + vpn_game 单点。
    location ^~ /vvv/api/game/ws {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host 127.0.0.1:8888;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://vpn_game/api/game/ws;
    }
    location ^~ /vvv/api/game/v1/ {
        rewrite ^/vvv(/.*)$ $1 break;
        default_type application/json;
        expires -1;
        proxy_pass http://vpn_game;
    }
}

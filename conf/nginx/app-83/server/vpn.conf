# 8.217.122.83 线上版：api.ok123find.top / file.ok123find.top / api.ok124find.top。
# 80 与 443 共用一个 server 块；路由全部在 /root/local/nginx/conf/api-routes.inc，
# api.sspacee.com 镜像（api-sspacee.conf）include 同一份。
# 这个文件与仓库 conf/nginx/vpn.conf（OpenResty 新机模板）是两套，别互相覆盖。

# Go-http-client 请求重定向到 Google（http 级，只允许一个 server 定义它）
map $http_user_agent $is_go_client {
    default 0;
    ~*Go-http-client 1;
}

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.ok123find.top file.ok123find.top api.ok124find.top;

    # HTTPS 证书：certbot（api.ok123find.top 组，SAN 含 ok124 与 book/file.ok123find），
    # renewal hook nginx-reload.sh 拷到这里并重载。
    ssl_certificate     /root/local/nginx/conf/ssl/fullchain.pem;
    ssl_certificate_key /root/local/nginx/conf/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /root/local/nginx/conf/api-routes.inc;
}

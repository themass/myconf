# livekit.ok123find.top 的中转 vhost（装在 104 本机编译版 nginx，/root/local/nginx-1.24.0）。
#
# LiveKit 信令只绑 127.0.0.1:7880，外部流量由 8.217 终结 TLS 后用
# http://104.160.191.87:80 + Host: livekit.ok123find.top 转发进来（80 已跨机开放，
# 不需要为 LiveKit 新开 7880 或改它的 bind），这里再转回环。
# ACME 校验在 8.217 侧做，本机不需要 acme-challenge 路径。

map $http_upgrade $livekit_conn_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name livekit.ok123find.top;

    # livekit-android 2.29.0 请求的是带尾斜杠的 /rtc/，而 Go ServeMux 只注册精确的
    # /rtc（rtcservice.go:101），尾斜杠会落进根 catch-all 直接 404（LiveKit Cloud
    # 边缘能吃掉尾斜杠，自托管不吃）。这里精确匹配后改写回 /rtc 再转上游；
    # proxy_pass 带 URI 时 nginx 自动保留原 query string（SDK 的 protocol/token 参数都在里面）。
    location = /rtc/ {
        proxy_pass http://127.0.0.1:7880/rtc;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $livekit_conn_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 其余：根路径返回 200（版本探测页）、/rtc 与 /rtc/v1（agent worker）照原样转。
    location / {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $livekit_conn_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# 应用机的上游定义。innerip 由 /etc/hosts 解析到 127.0.0.1（infra_ip 的约定）。
#
# vpn_server：本机后端。原值是 :8080，但该端口早已没有进程监听（实测 connection refused），
# 后端实际在 :8888。vpn.conf 一直 404，一半原因就在这里。
upstream vpn_server {
    server  innerip:8888;
     keepalive 80;
}
# 视频条目走独立节点。原值 85.117.235.88:8080 已不可达；
# 换成 91.149.239.221:8888（与 8.217.122.83 上的 fetchurl_server 一致，实测存活）。
upstream vpn_server_fetchurl {
    server  91.149.239.221:8888  weight=10 max_fails=3 fail_timeout=10s;
     keepalive 80;
}
upstream php {
    server unix:/home/web/var/run/php.sock  weight=1 max_fails=2 fail_timeout=30s;
}

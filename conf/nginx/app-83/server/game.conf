# 飞机对决 H5 玩家入口（页面域名，与 api 接口域名职责分离）。
# 证书：certbot（/etc/letsencrypt/live/game.ok123find.top，renewal hook 自动同步到
# /root/local/nginx/conf/ssl/game-*.pem 并重载）。当前文件里的临时自签证书仅占位。
server {
    listen 80;
    listen [::]:80;
    server_name game.ok123find.top;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://game.ok123find.top$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name game.ok123find.top;

    ssl_certificate     /root/local/nginx/conf/ssl/game-fullchain.pem;
    ssl_certificate_key /root/local/nginx/conf/ssl/game-privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # H5 静态站（发布物 = myproject/plane-duel 构建产物，见 /root/work/deploy-plane-h5.sh）
    root /home/web/webroot/plane-duel;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }

    # 页面域内反代游戏接口（同源 → 零 CORS；形状与 api 域 vpn.conf 完全一致）
    location ^~ /vvv/api/game/ws {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host 127.0.0.1:8888;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://vpn_game/api/game/ws;
    }
    location ^~ /vvv/api/game/v1/ {
        rewrite ^/vvv(/.*)$ $1 break;
        default_type application/json;
        expires -1;
        proxy_pass http://vpn_game;
    }
}

# api.sspacee.com / file.sspacee.com：api.ok123find.top 的镜像。
# 主域名被阻断时客户端切到这个域名；路由与 vpn.conf 完全一致（同一份 include）。
# 证书目前是 conf/ssl/api-sspacee-*.pem 自签占位；DNS A 记录改到本机后
# 用 certbot 签发（方法见 app-83/README.md）。

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.sspacee.com file.sspacee.com;

    ssl_certificate     /root/local/nginx/conf/ssl/api-sspacee-fullchain.pem;
    ssl_certificate_key /root/local/nginx/conf/ssl/api-sspacee-privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /root/local/nginx/conf/api-routes.inc;
}

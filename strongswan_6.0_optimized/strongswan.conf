# strongSwan 6.0 安全优化配置
# 基于原配置进行安全增强和性能优化

charon {
    # 安全设置
    duplicheck.enable = no
    ignore_acquire_ts = yes
    
    # DNS 配置 - 使用更安全的 DNS 服务器
    dns1 = 8.8.8.8
    dns2 = 1.1.1.1
    dns3 = 114.114.114.114
    
    # 重试和重传配置 - 优化性能
    retry_initiate_interval = 30
    retransmit_timeout = 4
    retransmit_tries = 5
    retransmit_base = 1.8
    retransmit_timeout_tries = 0
    
    # 连接管理优化
    half_open_timeout = 60
    half_open_limit = 1000
    
    # 内存和性能优化
    cache_crls = yes
    strict_revocation = yes
    
    # 日志配置 - 增强安全审计
    filelog {
        /var/log/strongswan/charon.log {
            time_format = %b %e %T
            ike_name = yes
            append = no
            default = 1
            flush_line = yes
            # 安全相关日志级别
            ike = 2
            knl = 2
            cfg = 2
            net = 2
            enc = 2
            lib = 2
        }
        # 安全审计日志
        /var/log/strongswan/security.log {
            time_format = %b %e %T
            ike_name = yes
            append = yes
            default = 0
            flush_line = yes
            # 只记录安全相关事件
            ike = 1
            knl = 1
            cfg = 1
        }
        stderr {
            ike = 2
            knl = 3
            cfg = 2
        }
    }
    
    syslog {
        identifier = strongswan-secure
        daemon {
            default = 1
        }
        auth {
            default = -1
            ike = 0
        }
    }
    
    # 插件配置 - 安全优化
    plugins {
        include strongswan.d/charon/*.conf
        
        # EAP-RADIUS 插件配置 - 安全增强
        eap-radius {
            accounting = yes
            # 启用 RADIUS 属性过滤
            attribute_filter = yes
            servers {
                radiusServer {
                    secret = FreeVPN@vpn5296
                    address = radius.sspacee.com
                    auth_port = 1812
                    acct_port = 1813
                    # 连接超时设置
                    timeout = 5
                    retries = 3
                    # 启用 NAS 标识
                    nas_identifier = strongswan-server
                }
            }
        }
        
        # 启用安全相关插件
        attr {
            load = yes
            # 启用属性过滤
            filter = yes
        }
        resolve {
            load = yes
        }
        kernel-netlink {
            load = yes
        }
        kernel-libipsec {
            load = yes
        }
        socket-default {
            load = yes
        }
        vici {
            load = yes
        }
        # 禁用不安全的插件
        stroke {
            load = no
        }
        # 启用安全增强插件
        counters {
            load = yes
        }
        forecast {
            load = yes
        }
        # 启用完整性检查
        integrity-test {
            load = yes
        }
    }
}

include strongswan.d/*.conf



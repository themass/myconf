# LiveKit Server 自托管配置（104 应用机）
# 由 shell/livekit.sh 渲染安装：{{...}} 占位符替换后写到 /home/web/etc/livekit/config.yaml（权限 600，含密钥）。
# 键名对照上游 config-sample.yaml（v1.13.11，已在线核对）：
#   port / keys / rtc.node_ip / rtc.use_external_ip / rtc.tcp_port / rtc.udp_port / rtc.port_range_* / turn.enabled

port: 7880          # 信令 HTTP/WS。只绑 127.0.0.1（livekit.sh 传 --bind），外部一律走 nginx 反代。

keys:
  {{LIVEKIT_API_KEY}}: {{LIVEKIT_API_SECRET}}

rtc:
  # 关键：104 单网卡挂 5 个公网 IP，use_external_ip:true 会对每个 IP 做 STUN 并全部 advertise
  # （v1.13.11 实测日志如此），node_ip 会被架空。显式钉死一个 IP，关掉 STUN 探测。
  node_ip: {{LIVEKIT_NODE_IP}}
  use_external_ip: false

  # 媒体 UDP 端口段。云安全组必须放行（livekit.sh 结束会提醒）。
  port_range_start: 50000
  port_range_end: 50019

  # ICE over TCP（7881）：UDP 被封时的媒体兜底通道。
  # 注意：rtc.udp_port 不设置——设了会变单端口复用，和 port_range 语义打架。
  tcp_port: 7881

turn:
  enabled: true
  # v1.13.11 源码 pkg/service/turn.go:83：tls_port 和 udp_port 都 <=0 直接报
  # "invalid TURN ports" 退出（文件配置不自动补默认值）。内置 TURN 的 UDP 端口是
  # turn.udp_port（默认 3478），和 rtc.tcp_port(ICE-TCP)/rtc.udp_port(ICE-UDP) 是三回事。
  udp_port: 3478
  # 不开 tls_port：TURN/TLS 证书主机名要和客户端连 TURN 的 host 一致，而 TURN 走的是
  # node_ip 直连，LE 域名证书签不上。国内移动网络先验证 TURN/UDP + ICE-TCP 够用再议。

logging:
  level: info
  pion_level: error

# 单节点不配 redis（LiveKit 无 redis 时进程内汇合；多节点扩展时再加）。

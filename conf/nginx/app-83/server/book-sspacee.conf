# book.sspacee.com：book.ok123find.top 的镜像，同一个证书组（api.sspacee.com SAN）。
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name book.sspacee.com;

    ssl_certificate     /root/local/nginx/conf/ssl/api-sspacee-fullchain.pem;
    ssl_certificate_key /root/local/nginx/conf/ssl/api-sspacee-privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    charset utf-8;
    expires 5d;
    add_header Access-Control-Allow-Origin *;
    default_type application/octet-stream;

    location / {
        alias /home/file/book/;
    }
}

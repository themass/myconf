[Interface]
Address = {{SERVER_CIDR}}
ListenPort = {{PORT}}
PrivateKey = {{PRIVATE_KEY}}
PostUp = iptables -t nat -A POSTROUTING -s {{SUBNET}} -o {{NETDEV}} -j MASQUERADE; iptables -A FORWARD -i %i -j ACCEPT; iptables -A FORWARD -o %i -j ACCEPT
PostDown = iptables -t nat -D POSTROUTING -s {{SUBNET}} -o {{NETDEV}} -j MASQUERADE; iptables -D FORWARD -i %i -j ACCEPT; iptables -D FORWARD -o %i -j ACCEPT

# strongSwan 6.0.2 配置 - 完全按照官方文档语法
charon {
    # DNS 配置
    dns1 = 8.8.8.8
    dns2 = 114.114.114.114
    
    # 插件配置
    plugins {
        eap-radius {
            accounting = yes
            servers {
                radiusServer {
                    secret = FreeVPN@vpn5296
                    address = radius.sspacee.com
                    auth_port = 1812
                    acct_port = 1813
                }
            }
        }
    }
    
    # 日志配置
    filelog {
        charon {
            path = /var/log/charon.log
            time_format = %b %e %T
            ike_name = yes
            append = no
            default = 1
            flush_line = yes
        }
        stderr {
            ike = 2
            knl = 3
        }
    }
    
    # 系统日志配置
    syslog {
        identifier = charon-custom
        daemon {
        }
        auth {
            default = -1
            ike = 0
        }
    }
    port = 8080
    port_nat_t = 8081
    threads = 16
    retransmit_tries = 3
    retransmit_timeout = 4.0
    reauth_time = 0
    rekey_time = 4h
    rekey_bytes = 100m
    rekey_packets = 1000000
    close_action = none
    send_vendor_id = yes
}

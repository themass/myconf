# strongSwan 6.0.2 配置文件 - 基于官方文档

charon {
    # 基础设置
    load_modular = yes
    threads = 16
    
    # 端口设置
    port = 500
    port_nat_t = 4500
    
    # 重传设置
    retransmit_tries = 3
    retransmit_timeout = 4.0
    
    # 重密钥设置
    rekey_time = 4h
    rekey_bytes = 100m
    rekey_packets = 1000000
    reauth_time = 0
    
    # 其他设置
    close_action = none
    send_vendor_id = yes
    
    # 插件配置
    plugins {
        include strongswan.d/charon/*.conf
        
        # EAP-RADIUS 插件
        eap-radius {
            accounting = yes
            servers {
                radiusServer {
                    secret = FreeVPN@vpn5296
                    address = radius.sspacee.com
                    auth_port = 1812
                    acct_port = 1813
                }
            }
        }
    }
    
    # 日志配置
    filelog {
        charon {
            path = /var/log/strongswan.log
            time_format = %b %e %T
            ike_name = yes
            append = no
            default = 1
            flush_line = yes
        }
    }
    
    syslog {
        identifier = charon
        daemon {
            ike = 2
            knl = 2
        }
        auth {
            default = 2
        }
    }
}

include strongswan.d/*.conf
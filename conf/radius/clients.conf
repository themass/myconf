# -*- text -*-
##
## clients.conf -- RADIUS 客户端（NAS）和共享密钥
##
## 由 bash infra.sh radius / bash radius.sh clients 部署到
## /etc/freeradius/clients.conf（权限 640、属组 freerad）。
## 改这里，不要直接改服务器上的文件。
##
## ---------------------------------------------------------------------------
## BlastRADIUS (CVE-2024-3596) 相关
##
## 3.2.x 每个 client 认识两个开关：
##   require_message_authenticator = yes  要求请求里必须有 Message-Authenticator
##   limit_proxy_state = yes  没有 MA 的包可以收，但带 Proxy-State 的必须带 MA
##
## 老服务器是 2.1.12，那时这两个检查根本不存在，现网 NAS 大多不会发
## Message-Authenticator。所以对真实 NAS 用 limit_proxy_state = yes：
## 普通 NAS 发起 Access-Request 时不带 Proxy-State，老设备照常认证；
## 而利用 Proxy-State 的 BlastRADIUS 攻击仍然被挡掉。
## 确认某台 NAS 会发 Message-Authenticator 后，再把它的
## require_message_authenticator 改成 yes 收紧。
##
## localhost 只用于本机自测，3.x 的 radtest/radclient 默认带
## Message-Authenticator，所以直接要求 yes。
## ---------------------------------------------------------------------------

client localhost {
	#  Allowed values are:
	#	dotted quad (1.2.3.4)
	#       hostname    (radius.example.com)
	ipaddr = 127.0.0.1

	# 本机自测用。不要用 testing123 这种默认值：3.2.x 每次启动都会警告
	# "Shared secret for client localhost is short, and likely can be broken"。
	# 自测命令里的密钥要和这条一致。
	secret = localtest@5296

	# 消掉 "Please set require_message_authenticator = true for client localhost"。
	# 3.x 的 radtest/radclient 默认会带 Message-Authenticator。
	require_message_authenticator = yes

	nastype     = other	# localhost isn't usually a NAS...
}

# 本机 IPv6 回环。radtest -6 或 ::1 发起的请求会匹配到这里；
# 不声明的话 3.2.x 会报 "for client localhost_ipv6" 的警告。
client localhost_ipv6 {
	ipv6addr	= ::1
	secret		= localtest@5296
	require_message_authenticator = yes
	nastype		= other
}

# ---------------------------------------------------------------------------
# 真实 NAS
#
# 用显式 ipaddr 的写法。老式 `client 1.2.3.4 { }` 在 3.2.x 里虽然还认
# （把块名当 IP），但每次启动都会警告
#   "No 'ipaddr' or 'ipv4addr' or 'ipv6addr' field found in client ..."
#   "Support for old-style clients will be removed in a future release"
# 所以统一改成显式声明。
#
# shortname 全部保持 vpn_check —— 线上策略和数据库里都按这个名字匹配，不要改。
# ---------------------------------------------------------------------------

#justhost start
client 176.32.39.182 {
    ipaddr        = 176.32.39.182
    secret        = FreeVPN@vpn5296
    shortname     = vpn_check
    require_message_authenticator = no
    limit_proxy_state = yes
}

# API 入口，在应用机（104.160.191.87 / 64.32.22.150 等）上运行。
#
# 与 8.217.122.83 那份的区别：
#   1. 后端在本机 :8888，且只认 /api/ 前缀（不认 /vvv/api/），所以这里要 rewrite 掉 /vvv。
#   2. 一份配置同时服务主域名和它的备域名 api.ok124find.top。
#      备域名存在的意义：主域名在 DNS 层被投毒/阻断时，客户端会自动切过来；
#      两个域名必须共用同一套路由，否则切换过去会落到默认站点返回 404，容灾等于没有。
#
# 证书：/root/local/sslkey/api.ok123find.top.{crt,key}
#   一张 Let's Encrypt 证书，SAN 同时含 api.ok123find.top / api.ok124find.top /
#   book.ok123find.top / file.ok123find.top。由 8.217.122.83 签发后复制过来
#   ——本机不能自己签：这两个域名的 A 记录都指向 8.217，webroot 校验到不了这里。

server {
    listen 80;
    listen 443 ssl;
    server_name api.ok123find.top file.ok123find.top api.ok124find.top;

    ssl_certificate     /root/local/sslkey/api.ok123find.top.crt;
    ssl_certificate_key /root/local/sslkey/api.ok123find.top.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:API_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    charset utf-8;
    expires -1;
    default_type 'application/json';

    client_max_body_size 20m;
    gzip on;
    gzip_types application/json text/plain text/css application/javascript;
    gzip_min_length 1024;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;

    # certbot webroot 校验。本机不签发，但保留这条：
    # 哪天把 A 记录改到本机，直接就能签，不用再改配置。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # 视频条目走单独的节点
    location = /vvv/api/video/item {
        rewrite ^/vvv(/.*)$ $1 break;
        proxy_pass http://vpn_server_fetchurl;
    }

    # 其余全部转给本机后端。rewrite 是必须的：后端挂在 /api/ 下，
    # 而客户端请求的是 /vvv/api/，不剥掉 /vvv 会 404。
    location /vvv/ {
        rewrite ^/vvv(/.*)$ $1 break;
        proxy_pass http://vpn_server;
    }

    # 隐私政策、账号删除等静态页（应用内会打开这些链接）
    location ^~ /file/ {
        alias /home/file/html/;
    }
    location = /favicon.ico {
        return 404;
    }
    location / {
        alias /home/file/html/;
        try_files $uri $uri/ =404;
    }
}

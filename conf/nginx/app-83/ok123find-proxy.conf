# ok123find.top：DNS 目前指向本机（8.217.122.83），真实站点在 104.160.191.87。
# 这里做反向代理，同时保留 ACME 校验路径给 certbot 续期。
# 等 DNS 改到 104.160.191.87 后，本文件可以删掉。

server {
    listen 80;
    server_name ok123find.top www.ok123find.top;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name ok123find.top www.ok123find.top;

    ssl_certificate     /etc/letsencrypt/live/ok123find.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ok123find.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        proxy_pass https://104.160.191.87;
        proxy_ssl_server_name on;
        proxy_ssl_name ok123find.top;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}

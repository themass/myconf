# livekit.ok123find.top：LiveKit 自托管（信令）反代，装在 8.217.122.83（TLS 终结机）。
#
# 拓扑：App → wss://livekit.ok123find.top:443（本机 TLS）→ http://104.160.191.87:80
#         →（104 本机 nginx，见 app-87/server/livekit-local.conf）→ 127.0.0.1:7880（LiveKit）。
# LiveKit 信令只绑回环，不能从外面直连 7880——必须经 104 nginx 中转，安全组也因此不用开 7880。
# 媒体（WebRTC UDP 50000-50019）和 TURN（udp 3478）、ICE-TCP（tcp 7881）不经这里，
# 由 ICE 直连 104 公网 IP（LiveKit 配置里 node_ip=104.160.191.87）。
#
# 证书在本机签（A 记录指向本机，webroot 校验可达）：
#   certbot certonly --webroot -w /var/www/letsencrypt -d livekit.ok123find.top
# 注意先后：先只装下面 :80 那段 reload，签完证书再装完整版（443 段引用 fullchain.pem，
# 证书不在 nginx -t 会失败）。
#
# $connection_upgrade 由同目录 00-upgrade-map.conf 定义（8.217 已有）。

server {
    listen 80;
    server_name livekit.ok123find.top;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    # 不写 http2：编译版 1.24.0 只有 `listen 443 ssl http2;` 老语法；信令 WS 不需要 h2，直接不开。
    server_name livekit.ok123find.top;

    ssl_certificate     /etc/letsencrypt/live/livekit.ok123find.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/livekit.ok123find.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # LiveKit 信令 = WebSocket（okhttp）。必须走 $connection_upgrade；
    # read timeout 要长：信令 WS 平时很安静，60s 会被掐，通话中途重连代价大。
    location /rtc/ {
        proxy_pass http://104.160.191.87:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 电话回调 / 房间 API 等其余路径（App 只用 /rtc，其余给运维工具 lk CLI 备用）。
    location / {
        proxy_pass http://104.160.191.87:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}

user  web;
worker_processes  auto;  # 自动根据 CPU 核心数设置工作进程数量
error_log  /var/log/nginx.error.log  warn;  # 将日志级别调整为 warn，减少日志量
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;  # 增加每个工作进程的连接数
    use epoll;
    multi_accept on;  # 允许一个进程同时接受多个连接
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$host - $request" '
                      '$status $body_bytes_sent $request_time "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx.access.log  main;
    server_name_in_redirect off;
    port_in_redirect off;
    limit_req_zone $binary_remote_addr zone=one:10m rate=100r/s;  # 根据需求调整请求限制速率

    include server/*.conf;

    proxy_set_header Host  $host;
    proxy_set_header REMOTE-HOST $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    proxy_buffer_size  512k;  # 增加代理缓冲区大小
    underscores_in_headers on;
    proxy_buffers   8 512k;  # 增加代理缓冲区数量和大小
    proxy_busy_buffers_size   512k;
    proxy_temp_path /home/file/nginx/cache/temp;

    sendfile        on;
    tcp_nopush     on;  # 开启 tcp_nopush 优化 TCP 发送性能

    keepalive_timeout  65;

    fastcgi_connect_timeout 300;
    fastcgi_send_timeout 300;
    fastcgi_read_timeout 300;
    fastcgi_buffer_size 1m;  # 增加快速 CGI 缓冲区大小
    fastcgi_buffers 8 1m;  # 增加快速 CGI 缓冲区数量和大小
    fastcgi_busy_buffers_size 1m;
    fastcgi_temp_file_write_size 1m;

    gzip on;
    gzip_min_length  1k;
    gzip_buffers     16 64k;  # 增加 gzip 缓冲区数量
    gzip_http_version 1.1;  # 使用 HTTP/1.1 支持分块传输
    gzip_comp_level 6;  # 增加压缩级别
    gzip_types   text/plain application/x-javascript text/css application/xml application/x-shockwave-flash application/json image/jpeg image/png image/gif;  # 增加对图片格式的压缩支持
    gzip_vary on;

    client_header_buffer_size 64k;  # 增加客户端头部缓冲区大小
    large_client_header_buffers 8 64k;  # 增加大头部缓冲区数量和大小
    client_max_body_size 100m;  # 增加允许上传的最大文件大小
    client_body_temp_path  /home/file/nginx_cache/cache/body;
    client_body_buffer_size 1m;  # 增加客户端请求体缓冲区大小
}

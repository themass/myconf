# /root/local/nginx/conf/server/book.conf
# book.ok123find.top：80 保持 HTTP，443 使用 Let's Encrypt 证书（与 api 共用，见 ssl/certbot.sh）。
# 注意：同一域名只能在一个文件里定义，删掉 sspacee3.conf 与 proxy/book.ok123find.top.conf 里的 book 配置。

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name book.ok123find.top;

    ssl_certificate     /root/local/nginx/conf/ssl/fullchain.pem;
    ssl_certificate_key /root/local/nginx/conf/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    charset utf-8;
    expires 5d;
    add_header Access-Control-Allow-Origin *;
    default_type application/octet-stream;

    # certbot webroot 校验（续期时需要通过 80 端口访问）
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        alias /home/file/book/;
    }
}

; php-fpm 进程池 "web"，由 infra.sh php 复制到 /etc/php/<版本>/fpm/pool.d/web.conf
; 以 web 用户运行，通过 unix socket 给 nginx 用（不占 TCP 端口）。
; 原来的默认池 www.conf 会被停用，避免两个池抢同一套资源。

[web]
user = web
group = web

listen = /run/php/php-fpm-web.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

request_terminate_timeout = 120s
catch_workers_output = yes

php_admin_value[error_log] = /var/log/php-fpm/web-error.log
php_admin_flag[log_errors] = on

config setup
    uniqueids=never

conn %default
    keyexchange=ikev2
    ike=aes256-sha256-ecp256,aes128-sha256-ecp256,aes256-sha384-ecp256,aes256gcm16-prfsha256-ecp256,aes256-sha384-ecp384,aes128-sha1-modp2048,aes256-sha384-modp4096,aes256-sha1-modp4096,aes128-sha1-modp1536,aes256-sha384-modp2048,aes256-sha1-modp2048,aes128-sha1-modp1024,aes256-sha384-modp1536,aes256-sha1-modp1536,aes256-sha384-modp1024,aes256-sha1-modp1024!
    left=%any
    leftsubnet=0.0.0.0/0,::/0
    right=%any

# charon.conf: port=8081, port_nat_t=8080
# NAT-T 包虽从 UDP 8080 进来，匹配 conn 时仍用 leftikeport=8081（与 charon.port 一致）
# 勿设 rightikeport；勿设 leftikeport=8080
conn radius
    also=%default
    leftca=caCert.pem
    leftcert=serverCert.pem
    rightsourceip=10.0.0.0/24,fec3::/120
    leftauth=pubkey
    rightauth=eap-radius
    rightsendcert=never
    eap_identity=%any
    dpdaction=restart
    dpddelay=20
    lifetime=8h
    margintime=5m
    ikelifetime=8h
    forceencaps=yes
    leftikeport=8081
    auto=add

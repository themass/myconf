# WordPress 站点：ok123find.top
# root 取自 blog.conf（/home/web/webroot/wordpress），php 走 upstream php（/home/web/var/run/php.sock）
# 证书是 Let's Encrypt 签的（ok123find.top.le.crt，SAN 含 www），由 8.217.122.83 上的 certbot 签发后拷过来；
# 自签的 ok123find.top.crt 仍留在同目录，作为签发/续期不可用时的备选。

server {
    listen 80;
    server_name ok123find.top www.ok123find.top;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name ok123find.top www.ok123find.top;
    charset utf-8;
    index index.php;
    root /home/web/webroot/wordpress;
    client_max_body_size 64m;

    ssl_certificate     /root/local/sslkey/ok123find.top.le.crt;
    ssl_certificate_key /root/local/sslkey/ok123find.top.le.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:WPSSL:10m;
    ssl_session_timeout 1d;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~* \.(php|php5)$ {
        try_files $uri =404;
        fastcgi_pass php;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_script_name;
        include fastcgi_params;
    }

    location ~* \.(js|css|gif|jpg|jpeg|png|bmp|swf|woff|woff2|svg|ico|webp)$ {
        expires 2h;
        access_log off;
    }
}

charon {
    plugins {
        duplicheck {
            enable = no
        }
    }

    dns1 = 8.8.8.8
    dns2 = 114.114.114.114
    port = 8081
    port_nat_t = 8080

    filelog {
        charon {
            path = /var/log/charon.log
            time_format = %b %e %T
            ike_name = yes
            append = no
            default = 1
            flush_line = yes
        }
        stderr {
            ike = 2
            knl = 3
        }
    }
    syslog {
        identifier = charon-custom
        daemon {
        }
        auth {
            default = -1
            ike = 0
        }
    }
}

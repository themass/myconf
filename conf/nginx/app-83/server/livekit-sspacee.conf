# livekit.sspacee.com：livekit.ok123find.top 的镜像。
# 拓扑与 ok123find 版一致：本机 TLS → 104.160.191.87:80 → LiveKit 7880。
# 证书目前是 conf/ssl/livekit-sspacee-*.pem 自签占位；DNS 改到本机后用 certbot 签发。
server {
    listen 80;
    server_name livekit.sspacee.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    # 编译版 1.24.0 只有 listen 443 ssl http2 老语法；信令 WS 不需要 h2，不开。
    server_name livekit.sspacee.com;

    ssl_certificate     /root/local/nginx/conf/ssl/livekit-sspacee-fullchain.pem;
    ssl_certificate_key /root/local/nginx/conf/ssl/livekit-sspacee-privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location /rtc/ {
        proxy_pass http://104.160.191.87:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://104.160.191.87:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}

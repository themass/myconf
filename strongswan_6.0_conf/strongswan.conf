# strongSwan 6.0.2 配置 - 基于官方文档的正确语法
charon {
    # 基础设置
    load_modular = yes
    threads = 16
    
    # 端口设置 - 修正端口配置
    port = 8081
    port_nat_t = 8080
    
    # 重传设置
    retransmit_tries = 3
    retransmit_timeout = 4.0
    
    # 重密钥设置
    rekey_time = 4h
    rekey_bytes = 100m
    rekey_packets = 1000000
    reauth_time = 0
    
    # 其他设置
    close_action = none
    send_vendor_id = yes
    
    # 插件配置
    plugins {
        include strongswan.d/charon/*.conf
        
        # EAP-RADIUS 插件 (已注释)
        # eap-radius {
        #     accounting = yes
        #     servers {
        #         radiusServer {
        #             secret = FreeVPN@vpn5296
        #             address = radius.sspacee.com
        #             auth_port = 1812
        #             acct_port = 1813
        #         }
        #     }
        # }
    }
    
    # 日志配置
    filelog {
        charon {
            path = /var/log/charon.log
            time_format = %b %e %T
            ike_name = yes
            append = no
            default = 1
            flush_line = yes
        }
        stderr {
            ike = 2
            knl = 3
        }
    }
    
    # 系统日志配置
    syslog {
        identifier = charon-custom
        daemon {
        }
        auth {
            default = -1
            ike = 0
        }
    }
}

# 包含其他配置文件
include strongswan.d/*.conf

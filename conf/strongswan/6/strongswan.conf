# strongSwan 6.x — EAP-RADIUS。IKE / NAT-T 端口由 vpn.sh strongswan config 填入（环境变量 SS_IKE_PORT / SS_NATT_PORT）
charon {
    load_modular = yes
    uniqueids = never

    dns1 = 8.8.8.8
    dns2 = 114.114.114.114

    port = {{IKE_PORT}}
    port_nat_t = {{NATT_PORT}}

    retransmit_tries = 10
    retransmit_timeout = 6.0
    retry_initiate_interval = 60

    rekey_time = 4h
    rekey_bytes = 100m
    rekey_packets = 1000000
    reauth_time = 0

    close_action = none
    send_vendor_id = yes

    plugins {
        include strongswan.d/charon/*.conf

        duplicheck {
            enable = no
        }

        kernel-libipsec {
            load = no
        }

        eap-radius {
            accounting = yes
            servers {
                radiusServer {
                    secret = FreeVPN@vpn5296
                    address = radius.sspacee.com
                    auth_port = 1812
                    acct_port = 1813
                }
            }
        }
    }

    filelog {
        charon {
            path = /var/log/charon.log
            time_format = %b %e %T
            ike_name = yes
            append = yes
            default = 1
            flush_line = no
        }
        stderr {
            ike = 2
            knl = 3
        }
    }

    syslog {
        identifier = charon-custom
        daemon {
        }
        auth {
            default = -1
            ike = 0
        }
    }
}

include strongswan.d/*.conf

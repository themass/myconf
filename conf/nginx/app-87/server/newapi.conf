server {
    listen 443 ssl;
    server_name gpt.sspacee.com;   # 或改成 book.ok123find.top，只留一个
    charset utf-8;
    #ssl_certificate     /root/local/sslkey/server.crt;
    #ssl_certificate_key /root/local/sslkey/server.key;
    ssl_certificate     /etc/letsencrypt/live/gpt.sspacee.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gpt.sspacee.com/privkey.pem;
    ssl_session_cache   shared:le_nginx_SSL:1m;
    ssl_session_timeout 1d;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }
}

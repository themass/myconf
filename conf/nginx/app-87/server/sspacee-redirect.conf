# sspacee.com 统一跳转到 jc.sspacee.com（80 和 443 都跳，443 用 sspacee.com 自己的证书）
server {
    listen 80;
    server_name sspacee.com www.sspacee.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://jc.sspacee.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name sspacee.com www.sspacee.com;

    ssl_certificate     /etc/letsencrypt/live/sspacee.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sspacee.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://jc.sspacee.com$request_uri;
    }
}
